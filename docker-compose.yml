version: '3.9'

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: securitybot
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U botuser -d securitybot']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Discord Bot ───────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - OWNER_IDS=${OWNER_IDS}
      - DATABASE_URL=postgresql://botuser:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/securitybot
      - SESSION_SECRET=${SESSION_SECRET}
      - OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs

  # ─── Dashboard Backend ─────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3001'
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - OWNER_IDS=${OWNER_IDS}
      - DATABASE_URL=postgresql://botuser:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/securitybot
      - SESSION_SECRET=${SESSION_SECRET}
      - OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - DASHBOARD_PORT=3001
      - NODE_ENV=production

volumes:
  postgres_data:
